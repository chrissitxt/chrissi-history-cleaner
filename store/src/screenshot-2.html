<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>chrissi's History Cleaner store screenshot</title>
    <style>
@font-face {
    font-family: "Crimson Pro";
    font-weight: 500;
    font-display: block;
    src: url("../../assets/CrimsonPro-Medium.woff2") format("woff2");
}

:root {
    --accent: #f0eeec;
    --body: #aeaba7;
    --highlight: #292725;
}

* {
    margin: 0;
}

body {
    font-family: "Crimson Pro";
    font-size: 30px;
    font-weight: 500;
    line-height: 1.35;
    background: var(--highlight);
    color: var(--body);
    display: flex;
    align-items: center;
    width: 1280px;
    height: 800px;
}

.text {
    width: 560px;
    padding-left: 96px;
}

h1 {
    font-size: 64px;
    font-weight: 500;
    line-height: 1.1;
    color: var(--accent);
}

p {
    max-width: 420px;
    margin-top: 20px;
}

.shot {
    flex: 1;
    display: flex;
    justify-content: center;
}

img {
    height: 640px;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
}
    </style>
</head>
<body>

<div class="text">
    <h1>Nothing leaves your browser</h1>
    <p>No tracking, no account, no network requests.</p>
</div>
<div class="shot">
    <img src="options-dark.png" alt="">
</div>

</body>
</html>
