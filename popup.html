<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chrissi's History Cleaner</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="style.css">
</head>
<body class="popup">

<main>
    <div class="head" style="--n:0">
        <h1>chrissi's History Cleaner</h1>
        <button class="icon-btn" id="openSettings" type="button" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg></button>
    </div>

    <div class="options" style="--n:1">
        <div class="row">
            <label><input type="checkbox" data-setting="pauseHistory"> Pause history</label>
            <button class="info" type="button" data-tip="Every new visit gets deleted the moment it's saved, since Chromium can't be told to stop recording. Your older history stays untouched."><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg></button>
        </div>
        <div class="row">
            <label><input type="checkbox" data-setting="clearOnStartup"> Clear on startup</label>
            <button class="info" type="button" data-tip="Clears the selected data every time the browser opens. Extensions can't act while the browser is closing, so this is the closest thing to clearing on close. Tabs restored from your last session show up in your history again afterwards."><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg></button>
        </div>
        <div class="row">
            <span>Auto clear</span>
            <button class="info" type="button" data-tip="Clears the selected data every 2, 4 or 8 hours. The countdown only runs while the browser is open and starts over every time you restart it."><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg></button>
        </div>
        <div class="chips" role="group" aria-label="Auto clear interval">
            <button class="chip" type="button" aria-pressed="false" data-hours="0">Off</button>
            <button class="chip" type="button" aria-pressed="false" data-hours="2">2h</button>
            <button class="chip" type="button" aria-pressed="false" data-hours="4">4h</button>
            <button class="chip" type="button" aria-pressed="false" data-hours="8">8h</button>
        </div>
        <div class="row" id="timerRow" hidden>
            <span>Next clear in</span>
            <span class="value" id="countdown"></span>
        </div>
        <div class="row">
            <span>Last cleared</span>
            <span class="value" id="lastCleared"></span>
        </div>
    </div>

    <button class="pill" id="clearNow" type="button" style="--n:2">
        <span class="swap"><svg class="i trash" viewBox="0 0 24 24"><path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg><svg class="i check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10" /></svg></span>
        Clear now
    </button>
</main>

<div class="tooltip" id="tooltip" role="tooltip"></div>

<script type="module" src="popup.js"></script>
</body>
</html>
